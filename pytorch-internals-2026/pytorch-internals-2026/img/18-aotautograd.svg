<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="AOTAutograd traces forward and backward together then partitions into a forward graph and a backward graph"><title>AOTAutograd traces forward and backward together then partitions into a forward graph and a backward graph</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#F6F8FB"/><path d="M40 0H0V40" fill="none" stroke="#E5EAF2" stroke-width="1"/></pattern><marker id="m0" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#101828"/></marker><marker id="m1" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#B26A00"/></marker></defs><rect width="1280" height="720" fill="url(#grid)"/>
<rect x="56" y="40" width="6" height="46" rx="2" fill="#EE4C2C"/>
<text x="78" y="78" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#101828" text-anchor="start" xml:space="preserve">AOTAutograd: trace backward before running anything</text>
<text x="78" y="110" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">It turns your model into two compiled graphs.</text>
<text x="56" y="700" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">PyTorch Internals, 2026 edition</text>
<text x="1224" y="700" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#55607A" text-anchor="end" xml:space="preserve">18 / 26</text>
<rect x="62" y="140" width="270" height="110" rx="4" fill="#D5F1EC" stroke="#0E9384" stroke-width="2"/>
<text x="197" y="167.8" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">1. Trace</text>
<text x="197" y="193.75" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">Run forward and backward</text>
<text x="197" y="214" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">together on fake tensors. No</text>
<text x="197" y="234.25" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">real math happens.</text>
<polyline points="334,195 357,195" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="359" y="140" width="270" height="110" rx="4" fill="#D5F1EC" stroke="#0E9384" stroke-width="2"/>
<text x="494" y="177.925" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">2. Functionalize</text>
<text x="494" y="203.875" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">Replace in-place edits with</text>
<text x="494" y="224.125" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">pure operations.</text>
<polyline points="631,195 654,195" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="656" y="140" width="270" height="110" rx="4" fill="#D5F1EC" stroke="#0E9384" stroke-width="2"/>
<text x="791" y="177.925" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">3. Decompose</text>
<text x="791" y="203.875" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">Lower to Core ATen, a small</text>
<text x="791" y="224.125" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">and stable set of operators.</text>
<polyline points="928,195 951,195" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="953" y="140" width="270" height="110" rx="4" fill="#D5F1EC" stroke="#0E9384" stroke-width="2"/>
<text x="1088" y="177.925" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">4. Partition</text>
<text x="1088" y="203.875" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">Split into one forward graph</text>
<text x="1088" y="224.125" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">and one backward graph.</text>
<rect x="62" y="296" width="318" height="252" rx="4" fill="#FFFFFF" stroke="#101828" stroke-width="2.5"/>
<text x="82" y="330" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#101828" text-anchor="start" xml:space="preserve">Joint graph</text>
<text x="82" y="362" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">mm</text>
<text x="82" y="387.5" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">tanh</text>
<text x="82" y="413" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">sum</text>
<text x="82" y="438.5" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">tanh_backward</text>
<text x="82" y="464" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">mm_backward</text>
<polyline points="382,340 468,340" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<polyline points="382,500 468,500" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="470" y="296" width="330" height="84" rx="4" fill="#D5F1EC" stroke="#0E9384" stroke-width="2"/>
<text x="635" y="330.375" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">Forward graph</text>
<text x="635" y="357.275" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">mm, tanh, sum</text>
<rect x="470" y="464" width="330" height="84" rx="4" fill="#EADFFB" stroke="#6941C6" stroke-width="2"/>
<text x="635" y="498.375" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">Backward graph</text>
<text x="635" y="525.275" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">tanh_backward, mm_backward</text>
<polyline points="635,382 635,462" fill="none" stroke="#B26A00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1)"/>
<text x="652" y="428" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#B26A00" text-anchor="start" xml:space="preserve">saved tensors</text>
<text x="860" y="330" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="start" xml:space="preserve">At runtime</text>
<text x="860" y="360" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">The compiled forward graph runs and</text>
<text x="860" y="384.14" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">autograd keeps the saved tensors.</text>
<text x="860" y="408.28" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">When you call loss.backward(), the</text>
<text x="860" y="432.42" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">compiled backward graph runs as a</text>
<text x="860" y="456.56" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">single autograd node.</text>
<rect x="62" y="574" width="1162" height="98" rx="4" fill="#FDEFCB" stroke="#B26A00" stroke-width="2.5"/>
<text x="82" y="604" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="start" xml:space="preserve">Min-cut partitioner</text>
<text x="82" y="632" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">For each intermediate value: save it (costs memory) or recompute it in backward (costs time). This is activation</text>
<text x="82" y="654.4" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">checkpointing, chosen automatically.</text></svg>