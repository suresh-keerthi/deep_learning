<circle cx="66" cy="496" r="4" fill="#EE4C2C"/>
<text x="82" y="502" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">Python returns as soon as the kernel is queued, long before it finishes.</text>
<circle cx="66" cy="530" r="4" fill="#EE4C2C"/>
<text x="82" y="536" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">.item(), .cpu() and print(tensor) must wait for the GPU, so they act as sync points.</text>
<circle cx="66" cy="564" r="4" fill="#EE4C2C"/>
<text x="82" y="570" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">To time GPU code, call torch.cuda.synchronize() first. Otherwise you time only the queueing.</text>
<rect x="56" y="614" width="1168" height="56" rx="4" fill="#FDEFCB" stroke="#B26A00" stroke-width="2"/>
<text x="76" y="648" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">Many tiny kernels leave gaps on the GPU. CUDA graphs and torch.compile exist partly to close those gaps.</text></svg>