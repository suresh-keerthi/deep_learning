<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="A tensor from the Python object down through the C++ handle, TensorImpl and StorageImpl to memory"><title>A tensor from the Python object down through the C++ handle, TensorImpl and StorageImpl to memory</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#F6F8FB"/><path d="M40 0H0V40" fill="none" stroke="#E5EAF2" stroke-width="1"/></pattern><marker id="m0" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#101828"/></marker></defs><rect width="1280" height="720" fill="url(#grid)"/>
<rect x="56" y="40" width="6" height="46" rx="2" fill="#EE4C2C"/>
<text x="78" y="78" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#101828" text-anchor="start" xml:space="preserve">What is inside a tensor, from Python down to memory</text>
<text x="78" y="110" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">Five levels. The orange one holds the metadata.</text>
<text x="56" y="700" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">PyTorch Internals, 2026 edition</text>
<text x="1224" y="700" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#55607A" text-anchor="end" xml:space="preserve">8 / 26</text>
<rect x="80" y="140" width="440" height="78" rx="4" fill="#E3EAFD" stroke="#2F5BEA" stroke-width="2"/>
<text x="300" y="173.888" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">torch.Tensor (Python object)</text>
<text x="300" y="196.363" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">what x refers to in your script</text>
<polyline points="300,218 300,246" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="80" y="246" width="440" height="78" rx="4" fill="#FFFFFF" stroke="#9AA6BD" stroke-width="2"/>
<text x="300" y="279.887" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">at::Tensor (C++ handle)</text>
<text x="300" y="302.362" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">a reference-counted pointer; copying it is cheap</text>
<polyline points="300,324 300,352" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="80" y="352" width="440" height="78" rx="4" fill="#FDE4DD" stroke="#EE4C2C" stroke-width="2"/>
<text x="300" y="376.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">TensorImpl</text>
<text x="300" y="398.575" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">sizes, strides, offset, dtype, device, dispatch</text>
<text x="300" y="418.15" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">keys, autograd info</text>
<polyline points="300,430 300,458" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="80" y="458" width="440" height="78" rx="4" fill="#FFFFFF" stroke="#9AA6BD" stroke-width="2"/>
<text x="300" y="482.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">StorageImpl</text>
<text x="300" y="504.575" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">pointer to the bytes, size in bytes, which</text>
<text x="300" y="524.15" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">allocator owns them</text>
<polyline points="300,536 300,564" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="80" y="564" width="440" height="78" rx="4" fill="#E9EDF4" stroke="#9AA6BD" stroke-width="2"/>
<text x="300" y="597.887" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">Device memory</text>
<text x="300" y="620.362" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">CPU RAM, GPU memory, and so on</text>
<text x="600" y="168" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#101828" text-anchor="start" xml:space="preserve">A Python tensor can be a subclass:</text>
<text x="600" y="192" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">DTensor, FakeTensor, or one you write.</text>
<polyline points="520,179 580,179" fill="none" stroke="#9AA6BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
<rect x="600" y="232" width="624" height="284" rx="6" fill="#0F172A"/>
<text x="618" y="262.45" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#E2E8F0" text-anchor="start" xml:space="preserve">struct TensorImpl {</text>
<text x="618" y="287.1" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#E2E8F0" text-anchor="start" xml:space="preserve">  Storage storage_;</text>
<text x="618" y="311.75" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#E2E8F0" text-anchor="start" xml:space="preserve">  SizesAndStrides sizes_and_strides_;</text>
<text x="618" y="336.4" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#E2E8F0" text-anchor="start" xml:space="preserve">  int64_t storage_offset_;</text>
<text x="618" y="361.05" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#E2E8F0" text-anchor="start" xml:space="preserve">  TypeMeta data_type_;</text>
<text x="618" y="385.7" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#E2E8F0" text-anchor="start" xml:space="preserve">  optional&lt;Device&gt; device_opt_;</text>
<text x="618" y="410.35" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#FDBA74" text-anchor="start" xml:space="preserve">  DispatchKeySet key_set_;</text>
<text x="618" y="435" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#C4B5FD" text-anchor="start" xml:space="preserve">  AutogradMeta* autograd_meta_;</text>
<text x="618" y="459.65" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start" xml:space="preserve">  PyObjectSlot pyobj_slot_;  // back to Python</text>
<text x="618" y="484.3" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start" xml:space="preserve">};  // heavily simplified</text>
<polyline points="520,391 600,391" fill="none" stroke="#9AA6BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
<text x="600" y="546" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#101828" text-anchor="start" xml:space="preserve">The fields sit at fixed positions on purpose.</text>
<text x="600" y="570" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">Asking for a size never needs a virtual call.</text>
<text x="600" y="610" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#101828" text-anchor="start" xml:space="preserve">Storage has no dtype now. It is just bytes</text>
<text x="600" y="634" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">(UntypedStorage). The dtype lives on the tensor.</text>
<polyline points="520,497 560,497 560,606 590,606" fill="none" stroke="#9AA6BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/></svg>