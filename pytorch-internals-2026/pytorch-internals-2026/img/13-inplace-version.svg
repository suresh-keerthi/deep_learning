<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Three steps showing a saved tensor being edited in place and backward failing the version check"><title>Three steps showing a saved tensor being edited in place and backward failing the version check</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#F6F8FB"/><path d="M40 0H0V40" fill="none" stroke="#E5EAF2" stroke-width="1"/></pattern><marker id="m0" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#101828"/></marker></defs><rect width="1280" height="720" fill="url(#grid)"/>
<rect x="56" y="40" width="6" height="46" rx="2" fill="#EE4C2C"/>
<text x="78" y="78" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#101828" text-anchor="start" xml:space="preserve">In-place edits can break the backward pass</text>
<text x="78" y="110" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">Autograd keeps a version counter on every tensor to catch this.</text>
<text x="56" y="700" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">PyTorch Internals, 2026 edition</text>
<text x="1224" y="700" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#55607A" text-anchor="end" xml:space="preserve">13 / 26</text>
<rect x="60" y="140" width="360" height="240" rx="4" fill="#FFFFFF" stroke="#2F5BEA" stroke-width="2.5"/>
<text x="80" y="184" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#2F5BEA" text-anchor="start" xml:space="preserve">y = x.exp()</text>
<text x="80" y="226" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">exp's backward needs the result y,</text>
<text x="80" y="251.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">so autograd saves y.</text>
<rect x="80" y="322" width="179.04" height="34" rx="17" fill="#E3EAFD" stroke="#2F5BEA" stroke-width="1.5"/>
<text x="169.52" y="344.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#101828" text-anchor="middle" xml:space="preserve">y is at version 0</text>
<polyline points="422,260 458,260" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="460" y="140" width="360" height="240" rx="4" fill="#FFFFFF" stroke="#B26A00" stroke-width="2.5"/>
<text x="480" y="184" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#B26A00" text-anchor="start" xml:space="preserve">y.add_(1)</text>
<text x="480" y="226" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">Edits y's memory in place.</text>
<text x="480" y="251.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">The version counter goes up.</text>
<rect x="480" y="322" width="215.52" height="34" rx="17" fill="#FDEFCB" stroke="#B26A00" stroke-width="1.5"/>
<text x="587.76" y="344.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#101828" text-anchor="middle" xml:space="preserve">y is now at version 1</text>
<polyline points="822,260 858,260" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="860" y="140" width="360" height="240" rx="4" fill="#FFFFFF" stroke="#C01048" stroke-width="2.5"/>
<text x="880" y="184" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#C01048" text-anchor="start" xml:space="preserve">y.sum().backward()</text>
<text x="880" y="226" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">Autograd compares versions:</text>
<text x="880" y="251.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">saved 0, current 1. Mismatch.</text>
<rect x="880" y="322" width="133.44" height="34" rx="17" fill="#FCE0EA" stroke="#C01048" stroke-width="1.5"/>
<text x="946.72" y="344.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#101828" text-anchor="middle" xml:space="preserve">RuntimeError</text>
<rect x="60" y="420" width="560" height="190" rx="4" fill="#D5F1EC" stroke="#0E9384" stroke-width="2.5"/>
<text x="80" y="458" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#101828" text-anchor="start" xml:space="preserve">Why PyTorch checks</text>
<text x="80" y="490" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">If backward used the edited y, the gradient would be</text>
<text x="80" y="514.65" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">wrong and nothing would warn you. The check compares</text>
<text x="80" y="539.3" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">two integers, so it costs almost nothing.</text>
<rect x="660" y="420" width="560" height="190" rx="6" fill="#0F172A"/>
<text x="678" y="450.45" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#E2E8F0" text-anchor="start" xml:space="preserve">y = x.exp()</text>
<text x="678" y="475.95" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#86EFAC" text-anchor="start" xml:space="preserve">z = y + 1        # out of place: fine</text>
<text x="678" y="501.45" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#E2E8F0" text-anchor="start" xml:space="preserve">z.sum().backward()</text>
<text x="678" y="526.95" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#E2E8F0" text-anchor="start" xml:space="preserve"></text>
<text x="678" y="552.45" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start" xml:space="preserve"># In-place is fine when backward does</text>
<text x="678" y="577.95" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="start" xml:space="preserve"># not need the old value of that tensor.</text></svg>