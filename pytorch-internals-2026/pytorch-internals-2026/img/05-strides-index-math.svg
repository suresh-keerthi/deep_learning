<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Strides turn an index like t[1, 0] into a memory address by multiplying and adding"><title>Strides turn an index like t[1, 0] into a memory address by multiplying and adding</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#F6F8FB"/><path d="M40 0H0V40" fill="none" stroke="#E5EAF2" stroke-width="1"/></pattern><marker id="m0" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#EE4C2C"/></marker><marker id="m1" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#6941C6"/></marker></defs><rect width="1280" height="720" fill="url(#grid)"/>
<rect x="56" y="40" width="6" height="46" rx="2" fill="#EE4C2C"/>
<text x="78" y="78" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#101828" text-anchor="start" xml:space="preserve">Strides turn a position into a memory address</text>
<text x="78" y="110" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">t = [[1, 2], [3, 4], [5, 6]] has sizes (3, 2) and strides (2, 1)</text>
<text x="56" y="700" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">PyTorch Internals, 2026 edition</text>
<text x="1224" y="700" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#55607A" text-anchor="end" xml:space="preserve">5 / 26</text>
<rect x="80" y="170" width="70" height="70" rx="2" fill="#FFFFFF" stroke="#9AA6BD" stroke-width="2.5"/>
<text x="115" y="214" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#101828" text-anchor="middle" xml:space="preserve">1</text>
<rect x="150" y="170" width="70" height="70" rx="2" fill="#FFFFFF" stroke="#9AA6BD" stroke-width="2.5"/>
<text x="185" y="214" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#101828" text-anchor="middle" xml:space="preserve">2</text>
<rect x="80" y="240" width="70" height="70" rx="2" fill="#FDE4DD" stroke="#EE4C2C" stroke-width="2.5"/>
<text x="115" y="284" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#101828" text-anchor="middle" xml:space="preserve">3</text>
<rect x="150" y="240" width="70" height="70" rx="2" fill="#FFFFFF" stroke="#9AA6BD" stroke-width="2.5"/>
<text x="185" y="284" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#101828" text-anchor="middle" xml:space="preserve">4</text>
<rect x="80" y="310" width="70" height="70" rx="2" fill="#FFFFFF" stroke="#9AA6BD" stroke-width="2.5"/>
<text x="115" y="354" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#101828" text-anchor="middle" xml:space="preserve">5</text>
<rect x="150" y="310" width="70" height="70" rx="2" fill="#EADFFB" stroke="#6941C6" stroke-width="2.5"/>
<text x="185" y="354" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#101828" text-anchor="middle" xml:space="preserve">6</text>
<text x="80" y="405" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">logical view</text>
<text x="330" y="195" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" xml:space="preserve"><tspan fill="#101828" font-weight="500">address = offset + </tspan><tspan fill="#2F5BEA" font-weight="700">i</tspan><tspan fill="#101828" font-weight="500"> × s0 + </tspan><tspan fill="#EE4C2C" font-weight="700">j</tspan><tspan fill="#101828" font-weight="500"> × s1</tspan></text>
<text x="330" y="228" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">i and j are the indices. s0 and s1 are the strides. Offset is 0 here.</text>
<rect x="330" y="262" width="300" height="118" rx="4" fill="#FFFFFF" stroke="#EE4C2C" stroke-width="2.5"/>
<text x="348" y="296" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#EE4C2C" text-anchor="start" xml:space="preserve">t[1, 0]</text>
<text x="348" y="336" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" xml:space="preserve"><tspan fill="#2F5BEA" font-weight="700">1</tspan><tspan fill="#101828" font-weight="400"> × </tspan><tspan fill="#2F5BEA" font-weight="700">2</tspan><tspan fill="#101828" font-weight="400"> + </tspan><tspan fill="#EE4C2C" font-weight="700">0</tspan><tspan fill="#101828" font-weight="400"> × </tspan><tspan fill="#EE4C2C" font-weight="700">1</tspan><tspan fill="#101828" font-weight="700"> = 2</tspan></text>
<text x="348" y="366" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">memory[2] is 3</text>
<rect x="660" y="262" width="300" height="118" rx="4" fill="#FFFFFF" stroke="#6941C6" stroke-width="2.5"/>
<text x="678" y="296" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#6941C6" text-anchor="start" xml:space="preserve">t[2, 1]</text>
<text x="678" y="336" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" xml:space="preserve"><tspan fill="#2F5BEA" font-weight="700">2</tspan><tspan fill="#101828" font-weight="400"> × </tspan><tspan fill="#2F5BEA" font-weight="700">2</tspan><tspan fill="#101828" font-weight="400"> + </tspan><tspan fill="#EE4C2C" font-weight="700">1</tspan><tspan fill="#101828" font-weight="400"> × </tspan><tspan fill="#EE4C2C" font-weight="700">1</tspan><tspan fill="#101828" font-weight="700"> = 5</tspan></text>
<text x="678" y="366" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">memory[5] is 6</text>
<text x="330" y="468" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">memory (the storage)</text>
<rect x="330" y="478" width="100" height="60" rx="2" fill="#FFFFFF" stroke="#9AA6BD" stroke-width="2"/>
<text x="380" y="515.7" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#101828" text-anchor="middle" xml:space="preserve">1</text>
<rect x="430" y="478" width="100" height="60" rx="2" fill="#FFFFFF" stroke="#9AA6BD" stroke-width="2"/>
<text x="480" y="515.7" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#101828" text-anchor="middle" xml:space="preserve">2</text>
<rect x="530" y="478" width="100" height="60" rx="2" fill="#FDE4DD" stroke="#EE4C2C" stroke-width="2"/>
<text x="580" y="515.7" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#101828" text-anchor="middle" xml:space="preserve">3</text>
<rect x="630" y="478" width="100" height="60" rx="2" fill="#FFFFFF" stroke="#9AA6BD" stroke-width="2"/>
<text x="680" y="515.7" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#101828" text-anchor="middle" xml:space="preserve">4</text>
<rect x="730" y="478" width="100" height="60" rx="2" fill="#FFFFFF" stroke="#9AA6BD" stroke-width="2"/>
<text x="780" y="515.7" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#101828" text-anchor="middle" xml:space="preserve">5</text>
<rect x="830" y="478" width="100" height="60" rx="2" fill="#EADFFB" stroke="#6941C6" stroke-width="2"/>
<text x="880" y="515.7" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#101828" text-anchor="middle" xml:space="preserve">6</text>
<text x="380" y="562" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">0</text>
<text x="480" y="562" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">1</text>
<text x="580" y="562" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">2</text>
<text x="680" y="562" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">3</text>
<text x="780" y="562" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">4</text>
<text x="880" y="562" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">5</text>
<polyline points="480,380 580,476" fill="none" stroke="#EE4C2C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<polyline points="810,380 880,476" fill="none" stroke="#6941C6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m1)"/>
<rect x="990" y="170" width="234" height="210" rx="4" fill="#D5F1EC" stroke="#0E9384" stroke-width="2"/>
<text x="1008" y="204" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="start" xml:space="preserve">Row-major</text>
<text x="1008" y="232" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">The last index changes</text>
<text x="1008" y="254.4" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">fastest, so its stride</text>
<text x="1008" y="276.8" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">is 1. Each earlier</text>
<text x="1008" y="299.2" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">stride is the product of</text>
<text x="1008" y="321.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">the sizes to its right.</text>
<text x="330" y="620" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">Reading a tensor never needs a loop over dimensions: it is one multiply-add per index.</text></svg>