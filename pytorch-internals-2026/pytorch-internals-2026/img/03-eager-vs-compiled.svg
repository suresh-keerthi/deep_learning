<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Eager mode launches one kernel per operator; compiled mode captures the function and fuses kernels"><title>Eager mode launches one kernel per operator; compiled mode captures the function and fuses kernels</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#F6F8FB"/><path d="M40 0H0V40" fill="none" stroke="#E5EAF2" stroke-width="1"/></pattern><marker id="m0" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#101828"/></marker></defs><rect width="1280" height="720" fill="url(#grid)"/>
<rect x="56" y="40" width="6" height="46" rx="2" fill="#EE4C2C"/>
<text x="78" y="78" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#101828" text-anchor="start" xml:space="preserve">Two ways to run the same model</text>
<text x="78" y="110" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">Same code, same answers. Different execution strategy.</text>
<text x="56" y="700" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">PyTorch Internals, 2026 edition</text>
<text x="1224" y="700" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#55607A" text-anchor="end" xml:space="preserve">3 / 26</text>
<text x="80" y="172" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#101828" text-anchor="start" xml:space="preserve">Eager mode (the default)</text>
<rect x="80" y="200" width="150" height="80" rx="4" fill="#FFFFFF" stroke="#101828" stroke-width="2"/>
<text x="155" y="245.85" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">x @ W</text>
<polyline points="232,240 268,240" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="270" y="200" width="150" height="80" rx="4" fill="#E3EAFD" stroke="#2F5BEA" stroke-width="2"/>
<text x="345" y="234.9" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">matmul</text>
<text x="345" y="256.15" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">kernel</text>
<polyline points="422,240 458,240" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="460" y="200" width="150" height="80" rx="4" fill="#FFFFFF" stroke="#101828" stroke-width="2"/>
<text x="535" y="245.85" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">+ b</text>
<polyline points="612,240 648,240" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="650" y="200" width="150" height="80" rx="4" fill="#E3EAFD" stroke="#2F5BEA" stroke-width="2"/>
<text x="725" y="245.525" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">add kernel</text>
<polyline points="802,240 838,240" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="840" y="200" width="150" height="80" rx="4" fill="#FFFFFF" stroke="#101828" stroke-width="2"/>
<text x="915" y="245.85" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">relu(...)</text>
<polyline points="992,240 1028,240" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="1030" y="200" width="150" height="80" rx="4" fill="#E3EAFD" stroke="#2F5BEA" stroke-width="2"/>
<text x="1105" y="245.525" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">relu kernel</text>
<text x="80" y="318" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">Each Python line runs right away and launches its own kernel. Easy to debug with print and pdb.</text>
<line x1="56" y1="360" x2="1224" y2="360" stroke="#9AA6BD" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 6"/>
<text x="80" y="410" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#101828" text-anchor="start" xml:space="preserve">Compiled with torch.compile</text>
<rect x="80" y="440" width="190" height="110" rx="4" fill="#FFFFFF" stroke="#101828" stroke-width="2"/>
<text x="175" y="477.925" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">Your function</text>
<text x="175" y="503.875" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">plain Python,</text>
<text x="175" y="524.125" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">unchanged</text>
<polyline points="272,495 306,495" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="308" y="440" width="190" height="110" rx="4" fill="#D5F1EC" stroke="#0E9384" stroke-width="2"/>
<text x="403" y="477.925" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">Capture</text>
<text x="403" y="503.875" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">Dynamo records the</text>
<text x="403" y="524.125" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">tensor ops</text>
<polyline points="500,495 534,495" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="536" y="440" width="190" height="110" rx="4" fill="#D5F1EC" stroke="#0E9384" stroke-width="2"/>
<text x="631" y="477.925" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">Optimize</text>
<text x="631" y="503.875" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">Inductor fuses ops</text>
<text x="631" y="524.125" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">and writes kernels</text>
<polyline points="728,495 762,495" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="764" y="440" width="190" height="110" rx="4" fill="#E3EAFD" stroke="#2F5BEA" stroke-width="2"/>
<text x="859" y="488.05" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">Fused kernels</text>
<text x="859" y="514" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">far fewer launches</text>
<polyline points="956,495 990,495" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="992" y="440" width="190" height="110" rx="4" fill="#FFFFFF" stroke="#101828" stroke-width="2"/>
<text x="1087" y="477.925" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">Reuse</text>
<text x="1087" y="503.875" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">later calls skip</text>
<text x="1087" y="524.125" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">all of the above</text>
<text x="80" y="600" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">The first call pays a compile cost. Later calls run fewer, bigger kernels, so they are usually faster.</text>
<text x="80" y="628" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">If the code changes shape or type in ways the compiler did not expect, it compiles again.</text></svg>