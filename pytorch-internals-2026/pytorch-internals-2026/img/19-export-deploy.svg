<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="From an nn.Module through torch.export to an ExportedProgram and then AOTInductor, ExecuTorch or vendor compilers"><title>From an nn.Module through torch.export to an ExportedProgram and then AOTInductor, ExecuTorch or vendor compilers</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#F6F8FB"/><path d="M40 0H0V40" fill="none" stroke="#E5EAF2" stroke-width="1"/></pattern><marker id="m0" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#101828"/></marker><marker id="m1" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#0E9384"/></marker><marker id="m2" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#2F5BEA"/></marker><marker id="m3" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#55607A"/></marker></defs><rect width="1280" height="720" fill="url(#grid)"/>
<rect x="56" y="40" width="6" height="46" rx="2" fill="#EE4C2C"/>
<text x="78" y="78" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#101828" text-anchor="start" xml:space="preserve">From a model to something you can ship</text>
<text x="78" y="110" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">torch.export captures the whole model once, with no Python left in it.</text>
<text x="56" y="700" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#55607A" text-anchor="start" xml:space="preserve">PyTorch Internals, 2026 edition</text>
<text x="1224" y="700" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#55607A" text-anchor="end" xml:space="preserve">19 / 26</text>
<rect x="56" y="320" width="210" height="100" rx="4" fill="#E3EAFD" stroke="#2F5BEA" stroke-width="2"/>
<text x="161" y="363.375" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">nn.Module</text>
<text x="161" y="389.625" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">plus example inputs</text>
<polyline points="268,370 306,370" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="308" y="320" width="210" height="100" rx="4" fill="#D5F1EC" stroke="#0E9384" stroke-width="2"/>
<text x="413" y="353.25" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#101828" text-anchor="middle" xml:space="preserve">torch.export</text>
<text x="413" y="379.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">traces the model into</text>
<text x="413" y="399.75" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle" xml:space="preserve">one graph</text>
<polyline points="520,370 558,370" fill="none" stroke="#101828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="560" y="240" width="310" height="260" rx="4" fill="#FFFFFF" stroke="#0E9384" stroke-width="2.5"/>
