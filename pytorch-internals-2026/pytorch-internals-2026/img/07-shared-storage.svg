<text x="130" y="244" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">sizes   (3, 2)</text>
