<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="A timeline with compute, all-gather and reduce-scatter lanes showing communication overlapping compute in FSDP2"><title>A timeline with compute, all-gather and reduce-scatter lanes showing communication overlapping compute in FSDP2</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#F6F8FB"/><path d="M40 0H0V40" fill="none" stroke="#E5EAF2" stroke-width="1"/></pattern><marker id="m0" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="13" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#55607A"/></marker></defs><rect width="1280" height="720" fill="url(#grid)"/>
