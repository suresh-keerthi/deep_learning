<text x="76" y="643" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#101828" text-anchor="start" xml:space="preserve">New in 2.13, opt-in: a separate communicator for reduce-scatter, so it can overlap with all-gather.</text></svg>